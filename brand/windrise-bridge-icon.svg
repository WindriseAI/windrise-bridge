<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="1024" height="1024">
  <title>Windrise Bridge</title>
  <!-- 云风筝：云就是那只风筝，在天上飞；一根线拉下来，连着你的电脑。浅蓝玻璃 + 白色哑光，光从左上来。 -->
  <defs>
    <filter id="b3" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="b6" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="b10" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="10"/></filter>
    <filter id="rim" x="-10%" y="-10%" width="120%" height="120%">
      <feMorphology in="SourceAlpha" operator="erode" radius="1.3" result="e"/>
      <feComposite in="SourceAlpha" in2="e" operator="out" result="ring"/>
      <feFlood flood-color="#ffffff" flood-opacity=".8"/><feComposite in2="ring" operator="in"/>
    </filter>
    <clipPath id="sq"><rect width="240" height="240" rx="54"/></clipPath>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f6fbff"/><stop offset=".55" stop-color="#d0ebff"/><stop offset="1" stop-color="#95ccf8"/></linearGradient>
    <radialGradient id="sheen" cx=".2" cy=".12" r=".65"><stop offset="0" stop-color="#fff" stop-opacity=".85"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <mask id="kite" maskUnits="userSpaceOnUse" x="0" y="0" width="240" height="240"><g fill="#fff" transform="rotate(-9 160 72)"><circle cx="130" cy="76" r="24"/><circle cx="161" cy="57" r="33"/><circle cx="192" cy="77" r="22"/><rect x="103" y="74" width="113" height="31" rx="15.5"/></g></mask>
    <linearGradient id="glass" gradientUnits="userSpaceOnUse" x1="110" y1="22" x2="214" y2="112"><stop offset="0" stop-color="#eef8ff"/><stop offset=".45" stop-color="#a3d3fb"/><stop offset="1" stop-color="#4699ee"/></linearGradient>
    <linearGradient id="rimFade" gradientUnits="userSpaceOnUse" x1="110" y1="22" x2="210" y2="112"><stop offset="0" stop-color="#fff"/><stop offset=".55" stop-color="#fff" stop-opacity=".5"/><stop offset="1" stop-color="#fff" stop-opacity=".12"/></linearGradient>
    <mask id="rimMask" maskUnits="userSpaceOnUse" x="0" y="0" width="240" height="240"><rect width="240" height="240" fill="url(#rimFade)"/></mask>
    <linearGradient id="white" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#dcebf9"/></linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#eaf6ff"/><stop offset="1" stop-color="#93c8f5"/></linearGradient>
  </defs>
  <g clip-path="url(#sq)">
    <rect width="240" height="240" fill="url(#base)"/>
    <rect width="240" height="240" fill="url(#sheen)"/>
    <!-- 远处一朵淡云，压住右下角 -->
    <g fill="#fff" opacity=".42"><circle cx="186" cy="206" r="13"/><circle cx="204" cy="200" r="16"/><circle cx="222" cy="208" r="11"/><rect x="174" y="206" width="58" height="14" rx="7"/></g>
    <!-- 显示器在地上的影子 -->
    <ellipse cx="78" cy="214" rx="42" ry="7" fill="#2f86dd" opacity=".28" filter="url(#b3)"/>
    <!-- 风筝线：从云下的系线点，带一点下垂，落到显示器顶上 -->
    <path d="M166 104 C162 146 98 130 78 152" fill="none" stroke="#5aa9ee" stroke-opacity=".3" stroke-width="7" stroke-linecap="round" filter="url(#b3)"/>
    <path d="M166 104 C162 146 98 130 78 152" fill="none" stroke="#ffffff" stroke-width="3.2" stroke-linecap="round"/>
    <!-- 本地电脑：白色哑光显示器，屏幕是浅蓝玻璃 -->
    <rect x="42" y="152" width="72" height="48" rx="9" fill="url(#white)"/>
    <path d="M51 153 H105" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" opacity=".9"/>
    <rect x="48" y="158" width="60" height="36" rx="5" fill="url(#screen)"/>
    <path d="M53 163 L72 163" stroke="#fff" stroke-opacity=".85" stroke-width="2" stroke-linecap="round"/>
    <path d="M70 200 H86 L90 208 H66 Z" fill="#e3effb"/>
    <circle cx="78" cy="152" r="3.6" fill="#ffffff"/>
    <!-- 云风筝在天上的影子 -->
    <g opacity=".2" filter="url(#b10)" transform="translate(8,14) rotate(-9 160 72)" fill="#2b7ad2"><circle cx="130" cy="76" r="24"/><circle cx="161" cy="57" r="33"/><circle cx="192" cy="77" r="22"/><rect x="103" y="74" width="113" height="31" rx="15.5"/></g>
    <!-- 尾巴：一条飘带带两个小结，往右下飘 -->
    <path d="M204 94 C214 106 204 118 214 130 C222 140 214 152 222 164" fill="none" stroke="#ffffff" stroke-opacity=".92" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M209 119 l8 -3 l-2 8 Z M216 146 l8 -2 l-3 8 Z" fill="#ffffff"/>
    <!-- 玻璃云风筝 -->
    <g opacity=".9"><rect width="240" height="240" fill="url(#glass)" mask="url(#kite)"/></g>
    <g mask="url(#kite)">
      <!-- 风筝骨架：细、淡，隐约透出来 -->
      <g transform="rotate(-9 160 72)" fill="none" stroke="#ffffff" stroke-opacity=".42" stroke-width="1.6" stroke-linecap="round"><path d="M160 28 V103"/><path d="M108 80 Q160 68 212 80"/></g>
      <ellipse cx="168" cy="104" rx="56" ry="12" fill="#2a7fd8" opacity=".35" filter="url(#b6)"/>
      <ellipse cx="140" cy="42" rx="26" ry="10" transform="rotate(-28 140 42)" fill="#fff" opacity=".85" filter="url(#b3)"/>
    </g>
    <g mask="url(#rimMask)"><g filter="url(#rim)"><rect width="240" height="240" fill="#fff" mask="url(#kite)"/></g></g>
    <!-- 系线点 -->
    <circle cx="166" cy="104" r="2.8" fill="#ffffff"/>
  </g>
</svg>
